<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181f">
<title>マルチ配信ビューア</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181f; --panel:#20232d; --line:#323644; --text:#e9eaf0; --sub:#8d91a3;
    --c1:#A58CDC; --c2:#6EB487; --c3:#DCFF50; --c4:#64C8F0;
    --blue:#64C8F0; --pink:#FF8C9B; --yellow:#FAC31E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Zen Kaku Gothic New",system-ui,"Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  button.on{background:var(--yellow);color:#16181f;border-color:var(--yellow)}
  button.warn{background:var(--pink);color:#16181f;border-color:var(--pink)}

  header{display:flex;gap:4px;align-items:center;padding:4px 4px}
  header h1{font-size:15px;margin:0 auto 0 4px;font-weight:700}
  header button{font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap}
  body.viewing header h1{display:none}
  body.viewing header button{flex:1;padding:5px 2px}

  #setup{padding:4px 8px 10px;display:grid;gap:8px}
  .urlrow{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:stretch;
    position:relative;transition:transform .15s}
  .urlrow.dragging{transition:none;z-index:2}
  .urlrow.dragging input{border-color:var(--blue)}
  .grip{position:relative;border-radius:5px;background:var(--c);touch-action:none;cursor:grab;
    display:grid;place-items:center}
  .grip::after{content:"";position:absolute;inset:-4px -8px -4px -6px}  /* 見た目は細く、触れる範囲は広く */
  .grip::before{content:"";width:6px;height:10px;opacity:.5;
    background:repeating-linear-gradient(#16181f 0 2px,transparent 2px 4px)}
  .urlrow.dragging .grip{cursor:grabbing}
  #setup input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:#0d0e13;color:var(--text);font-size:14px}
  .urlrow .del{padding:0 10px;color:var(--sub);border-radius:10px;line-height:1}
  .urlrow .del:hover{color:var(--text);border-color:var(--pink)}
  #addRow{width:100%;padding:9px;border-style:dashed;color:var(--sub)}
  #addRow:not(:disabled):hover{color:var(--text);border-color:var(--c1)}
  #addRow:disabled{opacity:.4;cursor:default}
  #setup .row{display:flex;gap:8px}
  #setup .row button{flex:1;padding:10px}
  #start{background:var(--c1);color:#16181f;border-color:var(--c1);font-weight:700}
  #msg{color:var(--pink);font-size:12px;min-height:1em;margin:0}
  .hint{color:var(--sub);font-size:12px;margin:0;line-height:1.6}

  #grid{flex:1;min-height:0;display:grid;gap:3px;padding:0 3px 3px;grid-template-columns:1fr}
  /* 行列数は JS の layoutGrid() がウインドウ形状から決める */
  .cell{display:flex;flex-direction:column;min-height:0;background:#000;border-radius:6px;
    overflow:hidden;border-top:2px solid var(--c)}
  .vid{flex:1;position:relative;min-height:0}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .bar{display:flex;align-items:center;gap:4px;padding:2px 3px;background:var(--panel)}
  .bar button{padding:1px 8px;font-size:12px;line-height:1.35;border-radius:7px}
  .bar button.mute{min-width:34px}
  .bar button.solo.on{background:var(--c);border-color:var(--c);color:#111}
  .bar input[type=range]{display:none;flex:1;accent-color:var(--c);min-width:0}
  .cell.showvol .bar input[type=range]{display:block}
  .bar .vol{min-width:46px;font-variant-numeric:tabular-nums}
  .cell.showvol .bar .vol{background:var(--c);border-color:var(--c);color:#111}
  .bar .solo{margin-left:auto}
  .cell.showvol .bar .solo{margin-left:0}
  .muted .bar input[type=range]{opacity:.35}
  /* Kotlin版の小窓（PiP）表示中は映像だけにする */
  body.pip header, body.pip #setup, body.pip .bar{display:none!important}
  body.pip #grid{gap:0;padding:0}
  body.pip .cell{border-radius:0;border-top-width:0}

  /* 視聴中は上下のメニューを映像に重ねる。場所を取らないぶん映像が大きくなる */
  body.viewing header{position:absolute;top:0;left:0;right:0;z-index:3;padding:4px;
    background:linear-gradient(rgba(22,24,31,.85),rgba(22,24,31,0));transition:opacity .25s}
  body.viewing header button{font-size:11px;padding:4px 2px;border-radius:7px}
  body.viewing #setup{margin-top:40px}
  body.viewing .cell{position:relative}
  body.viewing .vid{position:absolute;inset:0;flex:none}
  body.viewing .bar{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:2px;gap:3px;
    background:rgba(32,35,45,.82);transition:opacity .25s}
  body.viewing .bar button{font-size:11px;padding:1px 6px}
  body.viewing .bar .vol{min-width:42px}
  /* 無操作で消す */
  body.chrome-hidden header,body.chrome-hidden .bar{opacity:0;pointer-events:none}
  /* 消えている間だけ透明な層を被せ、最初のタップで戻す（映像はiframeなのでタップが届かないため） */
  #tapcatch{position:fixed;inset:0;z-index:4;display:none}
  body.chrome-hidden #tapcatch{display:block}
  body.pip #tapcatch{display:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>マルチ配信ビューア</h1>
  <button id="playAll" hidden>▶ 全部</button>
  <button id="pauseAll" hidden>⏸ 全部</button>
  <button id="wake" title="再生中に画面が消えないようにする">画面ON</button>
  <button id="fs">全画面</button>
  <button id="toggleSetup" hidden>URL</button>
</header>

<section id="setup">
  <div id="urlRows" style="display:grid;gap:8px"></div>
  <button id="addRow" type="button">＋ 配信を追加</button>
  <div class="row">
    <button id="clear">入力をクリア</button>
    <button id="start">視聴を開始</button>
  </div>
  <p id="msg"></p>
  <p class="hint">「＋ 配信を追加」で欄を増やせます（最大4つ）。×で欄を減らせます。<br>
  左端の色の部分をドラッグすると、表示順を並び替えられます（上から順に表示）。<br>
  配信ページのURLをそのまま貼り付けてください。チャンネルページのURLでは開けません。<br>
  音が出ない配信は、下のバーの🔇をタップすると鳴ります。</p>
</section>

<main id="grid" data-n="0"></main>
<div id="tapcatch"></div>


<script>
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const MAX = 4;   // PiPの縦横比 16:(9×本数) が下限0.418を下回らない上限
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let players = [];
let vols = store.get('mv_vols', []);
if(!Array.isArray(vols)) vols = [];
while(vols.length < MAX) vols.push(80);
let soloIdx = -1;

// 保存済みURLを復元する。末尾の空欄は捨てて、実際に使っていた本数だけ並べる
let urls = store.get('mv_urls', ['']);
if(!Array.isArray(urls)) urls = [''];
urls = urls.slice(0, MAX).map(u => u || '');
while(urls.length > 1 && !urls[urls.length-1]) urls.pop();
if(!urls.length) urls = [''];

// 画面上の入力値を urls に取り込む
function readInputs(){
  urls = urls.map((u,i)=>{ const el = $('u'+i); return el ? el.value : u; });
}
function saveUrls(){ store.set('mv_urls', urls); }

function renderRows(){
  const wrap = $('urlRows');
  wrap.textContent = '';
  urls.forEach((val, i) => {
    const row = document.createElement('div');
    row.className = 'urlrow';
    row.style.setProperty('--c', COLORS[i]);

    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.setAttribute('aria-hidden','true');

    const input = document.createElement('input');
    input.id = 'u' + i;
    input.inputMode = 'url';
    input.setAttribute('aria-label', `配信${i+1}のURL`);
    input.placeholder = i === 0 ? '配信1のURL（youtube.com/live/… など）' : `配信${i+1}のURL`;
    input.value = val || '';
    input.addEventListener('change', () => { readInputs(); saveUrls(); });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', `配信${i+1}の欄を削除`);
    del.hidden = urls.length <= 1;   // 最低1欄は残す
    del.onclick = () => removeRow(i);

    row.append(grip, input, del);
    wrap.appendChild(row);
  });
  $('addRow').disabled = urls.length >= MAX;
  bindDrag();
}

function addRow(){
  if(urls.length >= MAX) return;
  readInputs();
  urls.push('');
  renderRows();
  saveUrls();
  $('u' + (urls.length - 1)).focus();
}

function removeRow(i){
  if(urls.length <= 1) return;
  readInputs();
  urls.splice(i, 1);
  // 音量も同じ位置を抜いて、末尾を既定値で補う
  vols.splice(i, 1); vols.push(80);
  renderRows();
  saveUrls();
  store.set('mv_vols', vols);
}

function parseId(s){
  s = (s||'').trim();
  if(!s) return null;
  if(/^[\w-]{11}$/.test(s)) return s;
  try{
    const u = new URL(s);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1,12);
    const v = u.searchParams.get('v'); if(v) return v.slice(0,11);
    const m = u.pathname.match(/\/(live|shorts|embed)\/([\w-]{11})/);
    if(m) return m[2];
  }catch(e){}
  return null;
}

// YouTube IFrame API を読み込む
let apiPromise = null;
function loadApi(){
  if(apiPromise) return apiPromise;
  apiPromise = new Promise((resolve, reject)=>{
    if(window.YT && YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => reject(new Error('api'));
    document.head.appendChild(s);
  });
  return apiPromise;
}

async function start(){
  $('msg').style.color = '';
  readInputs();
  const raw = urls.map(u => (u || '').trim());
  const bad = raw.map((r,i)=> r && !parseId(r) ? (i+1) : null).filter(Boolean);
  const items = raw.map((r,i)=>({slot:i, id:parseId(r)})).filter(x=>x.id);
  if(bad.length){ $('msg').textContent = `配信${bad.join('・')}のURLを読み取れません。配信ページのURLを貼り付けてください。`; return; }
  if(!items.length){ $('msg').textContent = 'URLを1つ以上入力してください。'; return; }
  $('msg').textContent = '';
  store.set('mv_urls', raw);

  try{ await loadApi(); }
  catch(e){ $('msg').textContent = 'YouTubeの読み込みに失敗しました。通信状態を確認して再度お試しください。'; return; }

  players.forEach(p=>{ try{ p.player.destroy(); }catch(e){} });
  players = []; soloIdx = -1;
  const grid = $('grid');
  grid.innerHTML = '';
  grid.dataset.n = items.length;

  items.forEach((it, k)=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.setProperty('--c', COLORS[it.slot]);
    cell.innerHTML = `
      <div class="vid"><div id="p${it.slot}"></div></div>
      <div class="bar">
        <button class="mute" aria-label="ミュート切替">🔊</button>
        <button class="vol" aria-label="音量バーを表示">🎚 ${vols[it.slot]}</button>
        <input type="range" min="0" max="100" value="${vols[it.slot]}" aria-label="音量">
        <button class="solo">ソロ</button>
        <button class="reload" aria-label="読み込み直す">⟳</button>
      </div>`;
    grid.appendChild(cell);

    const entry = {slot:it.slot, id:it.id, cell, muted:false, player:null};
    entry.player = new YT.Player('p'+it.slot, {
      videoId: it.id,
      playerVars: {autoplay:1, playsinline:1, rel:0},
      events: {
        onReady: e => { e.target.setVolume(vols[it.slot]); e.target.unMute(); e.target.playVideo(); syncUi(); }
      }
    });
    players.push(entry);

    const q = sel => cell.querySelector(sel);
    q('.mute').onclick = () => { setMuted(entry, !entry.muted); soloIdx = -1; syncUi(); };
    q('input').oninput = ev => {
      const v = +ev.target.value; vols[it.slot] = v; store.set('mv_vols', vols);
      q('.vol').textContent = '🎚 ' + v;
      try{ entry.player.setVolume(v); if(entry.muted && v>0) setMuted(entry,false); }catch(e){}
      syncUi();
    };
    q('.vol').onclick = () => { cell.classList.toggle('showvol'); };
    q('.solo').onclick = () => {
      soloIdx = (soloIdx === k) ? -1 : k;
      players.forEach((p,j)=> setMuted(p, soloIdx !== -1 && j !== soloIdx));
      syncUi();
    };
    q('.reload').onclick = () => { try{ entry.player.loadVideoById(entry.id); }catch(e){} };
  });

  $('setup').hidden = true;
  ['playAll','pauseAll','toggleSetup'].forEach(id => $(id).hidden = false);
  document.body.classList.add('viewing');
  // 小窓(PiP)での並べ方をアプリに伝える。PiPが許す縦横比(約0.42〜2.39)に収まる組み合わせだけを使う
  const PIP_LAYOUT = {1:[1,1], 2:[1,2], 3:[1,3], 4:[2,2]};
  const pl = PIP_LAYOUT[items.length] || [1, items.length];
  try{
    if(window.Android){
      if(typeof Android.setAspect === 'function') Android.setAspect(pl[0] * 16, pl[1] * 9);
      else if(typeof Android.setCount === 'function') Android.setCount(items.length);
    }
  }catch(e){}
  lastLayout = "";   // 組み直した直後は必ず再計算する
  layoutGrid();
  showChrome();
}

function setMuted(p, m){
  p.muted = m;
  try{ m ? p.player.mute() : (p.player.unMute(), p.player.playVideo()); }catch(e){}
}

function syncUi(){
  players.forEach((p,j)=>{
    p.cell.classList.toggle('muted', p.muted);
    p.cell.querySelector('.mute').textContent = p.muted ? '🔇' : '🔊';
    p.cell.querySelector('.solo').classList.toggle('on', soloIdx === j);
  });
}

$('start').onclick = start;
$('addRow').onclick = addRow;
$('clear').onclick = () => { urls = urls.map(()=>''); renderRows(); saveUrls(); };
$('toggleSetup').onclick = () => { $('setup').hidden = !$('setup').hidden; };
$('playAll').onclick = () => players.forEach(p => { try{ if(!p.muted) p.player.unMute(); p.player.playVideo(); }catch(e){} });
$('pauseAll').onclick = () => players.forEach(p => { try{ p.player.pauseVideo(); }catch(e){} });

$('fs').onclick = async () => {
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){}
};

// URL欄の並び替え（左端の色の部分をドラッグ）。欄を作り直すたびに張り直す
function bindDrag(){
  const rows = [...document.querySelectorAll('.urlrow')];
  const GAP = 8;
  let drag = null;
  rows.forEach((row, idx) => {
    const grip = row.querySelector('.grip');
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      drag = { idx, row, startY: e.clientY, step: row.offsetHeight + GAP, target: idx };
      row.classList.add('dragging');
    });
    grip.addEventListener('pointermove', e => {
      if(!drag || drag.row !== row) return;
      const dy = e.clientY - drag.startY;
      const min = -drag.idx * drag.step, max = (rows.length - 1 - drag.idx) * drag.step;
      const y = Math.max(min, Math.min(max, dy));
      row.style.transform = `translateY(${y}px)`;
      drag.target = Math.max(0, Math.min(rows.length - 1, drag.idx + Math.round(y / drag.step)));
      rows.forEach((r, j) => {
        if(j === drag.idx) return;
        let shift = 0;
        if(drag.target > drag.idx && j > drag.idx && j <= drag.target) shift = -drag.step;
        if(drag.target < drag.idx && j < drag.idx && j >= drag.target) shift = drag.step;
        r.style.transform = shift ? `translateY(${shift}px)` : '';
      });
    });
    const end = () => {
      if(!drag || drag.row !== row) return;
      const {idx: from, target: to} = drag;
      drag = null;
      rows.forEach(r => { r.style.transform = ''; r.classList.remove('dragging'); });
      if(from === to) return;
      // 入力値と音量を新しい順番に入れ替える（色は位置で固定）
      readInputs();
      const order = urls.map((_,i)=>i); order.splice(to, 0, order.splice(from, 1)[0]);
      urls = order.map(src => urls[src]);
      vols = order.map(src => vols[src]).concat(vols.slice(order.length));
      renderRows();
      saveUrls();
      store.set('mv_vols', vols);
      if(document.body.classList.contains('viewing')){
        $('msg').style.color = 'var(--blue)';
        $('msg').textContent = '並び替えました。「視聴を開始」で反映されます。';
      }
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  });
}

renderRows();

// ウインドウの形から、動画が最も大きく見える行列数を選ぶ
function bestLayout(n, w, h, gap){
  let best = null;
  for(let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const cw = (w - gap * (cols - 1)) / cols;
    const ch = (h - gap * (rows - 1)) / rows;
    if(cw <= 0 || ch <= 0) continue;
    // セルに16:9を収めたときの幅。幅が大きいほど面積も大きい
    const vw = Math.min(cw, ch * 16 / 9);
    if(!best || vw > best.vw) best = {cols, rows, vw};
  }
  return best || {cols:1, rows:n};
}

let lastLayout = '';
function layoutGrid(){
  const grid = $('grid');
  const n = grid.children.length;
  if(!n) return;
  const r = grid.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
  const b = bestLayout(n, r.width, r.height, gap);
  const key = n + ':' + b.cols + 'x' + b.rows;
  if(key === lastLayout) return;   // 同じ配置なら触らない
  lastLayout = key;
  grid.style.gridTemplateColumns = `repeat(${b.cols},1fr)`;
  grid.style.gridTemplateRows = `repeat(${b.rows},1fr)`;
  // 余りが出る並べ方（3本を2x2など）では最後の1本を横に広げて隙間を作らない
  const leftover = b.cols * b.rows - n;
  [...grid.children].forEach((c, i) => {
    c.style.gridColumn = (leftover > 0 && i === n - 1) ? `span ${leftover + 1}` : '';
  });
}
addEventListener('resize', layoutGrid);
addEventListener('orientationchange', layoutGrid);

// 無操作で上下のメニューを隠す
const CHROME_DELAY = 3000;
let chromeTimer = null;
function showChrome(){
  document.body.classList.remove('chrome-hidden');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => {
    // 設定を開いている間と、視聴前は消さない
    if(document.body.classList.contains('viewing') && $('setup').hidden){
      document.body.classList.add('chrome-hidden');
    }
  }, CHROME_DELAY);
}
['pointerdown','pointermove','keydown','wheel'].forEach(ev =>
  addEventListener(ev, showChrome, {passive:true}));
if(window.ResizeObserver) new ResizeObserver(layoutGrid).observe($('grid'));

// 画面ON維持（Wake Lock）
let lock = null, wantLock = false;
async function acquire(){
  try{ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', ()=>{ lock = null; }); }
  catch(e){ wantLock = false; $('wake').classList.remove('on'); }
}
$('wake').onclick = async () => {
  if(!('wakeLock' in navigator)){ $('wake').disabled = true; return; }
  wantLock = !wantLock;
  $('wake').classList.toggle('on', wantLock);
  if(wantLock) await acquire(); else if(lock){ lock.release(); lock = null; }
};
document.addEventListener('visibilitychange', () => {
  if(wantLock && document.visibilityState === 'visible' && !lock) acquire();
});

// アプリ化（PWA）用
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

// アプリ内で動いているときは「画面ON」をログイン用に置き換える。
// 画面の常時点灯はアプリ側(FLAG_KEEP_SCREEN_ON)が担当しているのでWeb側の出番がない
(() => {
  const api = window.Android;
  if(!api || typeof api.openLogin !== 'function') return;   // ブラウザではそのまま「画面ON」
  const btn = $('wake');
  btn.title = 'YouTubeにログインすると広告なしで再生できます';
  btn.onclick = () => { try{ api.openLogin(); }catch(e){} };
  function refresh(){
    let ok = false;
    try{ ok = !!api.isSignedIn(); }catch(e){}
    btn.textContent = ok ? 'ログイン中' : '未ログイン';
    btn.classList.toggle('warn', !ok);
    btn.classList.remove('on');
  }
  refresh();
  // ログインから戻ってきたときに反映し直す
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') refresh();
  });
})();
</script>
</body>
</html>
